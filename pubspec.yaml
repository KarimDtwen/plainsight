name: plainsight
description: "Privacy-first web analytics — no cookies, ~50-line snippet. Flutter web dashboard + FastAPI backend."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts bundled offline (same pairing as the UniMatch v3 design system):
  # SpaceGrotesk for display/titles, Inter for body/labels.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
